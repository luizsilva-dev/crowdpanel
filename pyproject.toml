[project]
name = "crowdpanel"
version = "0.1.0"
description = "Simulate a crowd of customers discussing your offer on a public forum, then survey them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Luiz Silva" }]
keywords = ["simulation", "multi-agent", "llm", "market-research", "personas"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.75"]
openai = ["openai>=1.60"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]
all = ["crowdpanel[anthropic,openai,web]"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "crowdpanel[all]"]

[project.scripts]
crowdpanel = "crowdpanel.cli:main"

[project.urls]
Homepage = "https://github.com/luizsilva-dev/crowdpanel"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crowdpanel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
